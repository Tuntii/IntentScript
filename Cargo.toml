[workspace]
resolver = "2"
members = [
    "intentscript-core",
    "intentscript-parser",
    "intentscript-compiler",
    "intentscript-runtime",
    "intentscript-cli",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quickcheck = "1.0"
quickcheck_macros = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"

[workspace.package]
version = "0.1.0"
edition = "2021"
